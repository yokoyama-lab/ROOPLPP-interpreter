[project]
name = "rooplpp"
version = "1.0.0"
description = "ROOPL++ reversible object-oriented programming language interpreter"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
rplpp = "main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: 単体テスト（外部プロセスを起動しない）",
    "integration: OCaml 実装のバイナリを起動する差分テスト",
]
